# Publishes the marketing site, the privacy policy and the support page.
#
# WHY THESE ARE NOT LEFT ON THE BACKEND. They are served by the API too, at
# pulse-uk-api.onrender.com, and that is fine for a link somebody follows out of
# curiosity. It is not fine for the three URLs App Store Connect requires,
# because the free Render plan sleeps after about fifteen minutes idle and the
# next request pays a thirty to sixty second cold start. A reviewer clicking the
# privacy policy and getting a timeout is a rejection that has nothing to do
# with the app, and the keep-alive ping cannot help: it stops running when the
# instance stops, so a deploy during review leaves it asleep with nothing to
# wake it. GitHub Pages is static, free and always up.
#
# ONE SOURCE, NOT A COPY. This publishes api/public verbatim rather than keeping
# a second set of pages under docs/. Two copies of a privacy policy is two
# privacy policies, and the one nobody edits is the one Apple reads.
name: Marketing site

# MANUAL ONLY, and not by preference.
#
# Three runs failed here before this was switched off the push trigger. Pages
# is not enabled for this repository, and the workflow cannot enable it either:
# `enablement: true` returns "Create Pages site failed. Resource not accessible
# by integration", which is the Actions token being refused permission to
# create the site. On a private repository that is what a plan without Pages
# looks like from in here.
#
# Left on push it would fail on every commit that touches api/public and mail
# somebody about it each time, which trains people to ignore a red workflow.
# So it waits to be asked. Put the push trigger back the day a run of this
# actually goes green.
#
# If Pages is not available on this account, this file is the wrong answer
# entirely and ios/APPSTORE.md lists the hosts that are the right one.
on:
  workflow_dispatch:

# Required by the Pages deployment actions. contents: read is the default and
# is restated here because setting any permission clears the rest.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half way: an interrupted
# deploy can leave the site serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on for the repository if it is off, rather
      # than failing with "Get Pages site failed ... Not Found" and waiting for
      # somebody to find the setting. The first run did exactly that, because a
      # push triggers this before anyone has been to Settings.
      #
      # It cannot conjure an entitlement, though: Pages on a PRIVATE repository
      # needs a paid GitHub plan. On Free this still fails, and the answer is
      # either to make the repository public, upgrade, or host the site
      # somewhere else. See ios/APPSTORE.md.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # public/index.html is a template, not a page: it carries a {{CTA}}
      # placeholder that the running server fills in per request. Uploaded as
      # it sits on disk it would put the literal text {{CTA}} on the marketing
      # page, which is the page Apple is given. So it is rendered first, by the
      # same landing.js the server uses.
      #
      # Assembled into a separate directory rather than rendered in place, so
      # a rendered page can never be mistaken for the template and committed.
      - name: Assemble the site
        run: |
          cp -R api/public site
          node api/build-site.js site/index.html
        env:
          # Set this as a repository variable once the app is on sale and the
          # button becomes a real link. Unset, the page reads "Coming soon to
          # the App Store", which is correct before launch and safe to show a
          # reviewer.
          APP_STORE_URL: ${{ vars.APP_STORE_URL }}

      # The assembled site and nothing else. The web app in api/webapp is a
      # development convenience and is not part of the public site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
