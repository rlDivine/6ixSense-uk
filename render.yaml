# Render blueprint for the VenTrack UK backend.
#
# This file has to live at the REPOSITORY ROOT: Render's Blueprint flow only
# looks here, and it will not find a render.yaml nested inside a subdirectory.
# The service itself is in api/, so both Docker paths point down into it.
#
# In Render: New, then Blueprint, then connect this repo and pick the branch.
# Everything below is applied automatically. The four API keys are the only
# things you set by hand, in the dashboard, after the first deploy.
services:
  - type: web
    # DO NOT RENAME THIS. It is not the product name, it is the identity of a
    # live Render web service, and Render derives the public hostname from it:
    # this service is reachable at https://pulse-uk-api.onrender.com, and the
    # iOS client pins `productionURL` in EventService.swift to exactly that
    # host. The product was renamed from Pulse to VenTrack; this deployment
    # identity deliberately was not, because changing the string here does not
    # rename a service, it mints a different one on a different URL and takes
    # the deployed backend offline.
    #
    # Renaming it properly is a four-step migration, done on purpose and not as
    # tidying: create a new Render service under the new name, copy the four
    # API keys (TM_API_KEY, SKIDDLE_API_KEY, THESPORTSDB_KEY, PREDICTHQ_API_KEY)
    # across to it, update `productionURL` in the iOS app to the new host and
    # ship that build, and accept that every client still on the old build keeps
    # calling the old URL until it is updated. Until someone does all four, this
    # line stays as it is.
    name: pulse-uk-api
    runtime: docker

    # Free spins down after about 15 minutes idle, and the next request pays a
    # 30 to 60 second cold start. Change to `starter` (about $7/mo) before you
    # ship the app, so a user's first tap is not a minute of waiting.
    plan: free

    # The closest Render region to the UK, which keeps latency down for British
    # users and for the eventbrite.co.uk fetches.
    region: frankfurt

    # Both relative to the repository root. dockerContext is what makes the
    # Dockerfile's `COPY . .` copy the api directory rather than the whole repo,
    # so the iOS app never ends up inside the image.
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api

    # Never scrapes, so it is safe to hit as often as Render likes.
    healthCheckPath: /healthz

    # Redeploys on every push to the branch you connect.
    autoDeploy: true

    # $PORT is injected by Render and server.js already reads it, so the service
    # starts with no configuration at all. The keys below are optional: each
    # source is skipped when its key is unset, and the app still works from
    # Eventbrite UK and the built-in venue guide.
    #
    # sync: false means "ask me for this in the dashboard, and never overwrite
    # it from this file", which is what you want for a secret.
    envVars:
      - key: TM_API_KEY
        sync: false
      - key: SKIDDLE_API_KEY
        sync: false
      - key: THESPORTSDB_KEY
        sync: false
      # Sent as an Authorization: Bearer header, not a query parameter, despite
      # the _KEY suffix kept for consistency with the three above.
      - key: PREDICTHQ_API_KEY
        sync: false
      # Gates AI search and submission extraction. Unset and both are inert,
      # so this can be deployed before there is a key and nothing breaks.
      - key: AI_API_KEY
        sync: false
      # Shuts the moderation queue unless set. See api/.env.example.
      - key: MODERATION_TOKEN
        sync: false
