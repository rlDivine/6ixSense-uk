# Render blueprint for the VenTrack UK backend.
#
# This file has to live at the REPOSITORY ROOT: Render's Blueprint flow only
# looks here, and it will not find a render.yaml nested inside a subdirectory.
# The service itself is in api/, so both Docker paths point down into it.
#
# In Render: New, then Blueprint, then connect this repo and pick the branch.
# Everything below is applied automatically. The four API keys are the only
# things you set by hand, in the dashboard, after the first deploy.
services:
  - type: web
    # DO NOT RENAME THIS. It is not the product name, it is the identity of a
    # live Render web service, and Render derives the public hostname from it:
    # this service is reachable at https://pulse-uk-api.onrender.com, and the
    # iOS client pins `productionURL` in EventService.swift to exactly that
    # host. The product was renamed from Pulse to VenTrack; this deployment
    # identity deliberately was not, because changing the string here does not
    # rename a service, it mints a different one on a different URL and takes
    # the deployed backend offline.
    #
    # Renaming it properly is a four-step migration, done on purpose and not as
    # tidying: create a new Render service under the new name, copy the four
    # API keys (TM_API_KEY, SKIDDLE_API_KEY, THESPORTSDB_KEY, PREDICTHQ_API_KEY)
    # across to it, update `productionURL` in the iOS app to the new host and
    # ship that build, and accept that every client still on the old build keeps
    # calling the old URL until it is updated. Until someone does all four, this
    # line stays as it is.
    name: pulse-uk-api
    runtime: docker

    # Free spins down after about 15 minutes idle, and the next request pays a
    # 30 to 60 second cold start. Change to `starter` (about $7/mo) before you
    # ship the app, so a user's first tap is not a minute of waiting.
    plan: free

    # The closest Render region to the UK, which keeps latency down for British
    # users and for the eventbrite.co.uk fetches.
    region: frankfurt

    # Both relative to the repository root. dockerContext is what makes the
    # Dockerfile's `COPY . .` copy the api directory rather than the whole repo,
    # so the iOS app never ends up inside the image.
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api

    # Never scrapes, so it is safe to hit as often as Render likes.
    healthCheckPath: /healthz

    # Redeploys on every push to the branch you connect.
    autoDeploy: true

    # $PORT is injected by Render and server.js already reads it, so the service
    # starts with no configuration at all. The keys below are optional: each
    # source is skipped when its key is unset, and the app still works from
    # Eventbrite UK and the built-in venue guide.
    #
    # sync: false means "ask me for this in the dashboard, and never overwrite
    # it from this file", which is what you want for a secret.
    envVars:
      - key: TM_API_KEY
        sync: false
      - key: SKIDDLE_API_KEY
        sync: false
      - key: THESPORTSDB_KEY
        sync: false
      # Sent as an Authorization: Bearer header, not a query parameter, despite
      # the _KEY suffix kept for consistency with the three above.
      - key: PREDICTHQ_API_KEY
        sync: false
      # Powers api/sources/localscan.js: an LLM reads the community pages
      # listed in api/sources/localscan-seeds.js (council sites, venues,
      # Facebook Pages) and pulls out real events that never reach a
      # ticketing platform. Without this key the source returns nothing, the
      # same as every other keyed source above. With it set but no pages
      # listed in localscan-seeds.js, it still returns nothing: the seed list
      # is what actually costs money, one LLM call per page per refresh
      # window, so grow it deliberately. See the long comment at the top of
      # localscan.js for the caching that keeps that cost bounded.
      - key: OPENAI_API_KEY
        sync: false

  # Runs the monthly localscan research pass: api/discover-seeds.js, not
  # server.js. A Cron Job rather than a timer inside the web service above on
  # purpose. The web service is on the free plan and sleeps after 15 minutes
  # idle, so an in-process "has 30 days passed" check has nothing durable to
  # remember that against and no guarantee of being awake when the date
  # arrives. A Cron Job runs on Render's own schedule regardless, bills only
  # for the few minutes it actually takes to run once a month, and exits
  # rather than staying resident.
  #
  # THE FIELD NAMES BELOW (schedule, dockerCommand) ARE WRITTEN FROM
  # DOCUMENTATION, NOT CONFIRMED AGAINST A LIVE BLUEPRINT DEPLOY, unlike the
  # `type: web` block above which has been running. Check them against
  # whatever Render actually accepts the first time this Blueprint is
  # applied, and adjust here if it disagrees; nothing else in this file
  # depends on this block being right.
  - type: cron
    name: ventrack-uk-localscan-discover
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    # Overrides the image's default `node server.js` for this service only.
    dockerCommand: node discover-seeds.js
    # 06:00 UTC on the 1st of every month. Cron syntax, in UTC.
    schedule: "0 6 1 * *"
    envVars:
      # Same key as the web service above; Render treats these as separate
      # values even though the name matches, so it has to be set here too.
      - key: OPENAI_API_KEY
        sync: false
      # A fine grained personal access token (github.com Settings, Developer
      # settings, Fine-grained tokens), scoped to ONLY this repository, with
      # Contents: Read and write and Pull requests: Read and write and
      # nothing else. Not a classic token: a classic token's scopes are
      # account-wide, and this job has no reason to be able to touch any
      # other repository. Without this set, the job still runs and still
      # searches, it just logs what it found instead of opening a pull
      # request: see openCandidatesPR() in localscan-discover.js.
      - key: GITHUB_TOKEN
        sync: false
