<!-- Pulse mark, "Proximity": a filled dot with two rising arcs above it.
     The geometry matches PulseLogoGeometry in ios/Pulse/Design/Theme.swift and
     the rasterisers in ios/tools/make_icon.js and ios/tools/make_icon.swift.
     Change one, change all four.
     Dot centre (12, 17) r 2.6 filled; arcs on radius 6.2 and 11, stroked at
     2.1 with round caps, all on a 24 grid, drawn here scaled by 512/24 * 0.62
     and centred. The tile is accent-fill with the mark knocked out in white.
     Flat colour throughout: no gradient, no shadow, no rounded rectangle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pulse">
  <rect width="512" height="512" fill="#C8102E"/>
  <g transform="translate(256 256) scale(13.226667) translate(-12 -12)"
     fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round">
    <circle cx="12" cy="17" r="2.6" fill="#FFFFFF" stroke="none"/>
    <path d="M7.6 12.6a6.2 6.2 0 0 1 8.8 0"/>
    <path d="M4.2 8.9a11 11 0 0 1 15.6 0"/>
  </g>
</svg>
